services:
  sixdroid:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: sixdroid
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./apks:/apks:ro
    environment:
      DEVICE_HOST: ${DEVICE_HOST:-10.141.10.152}
      EMULATOR_AGENT: ${EMULATOR_AGENT:-http://10.176.160.231:4780}
