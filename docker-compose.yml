services:
  sixdroid:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: sixdroid
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DEVICE_HOST: ${DEVICE_HOST:-10.141.10.152}
      REMOTE_ANDROIDS: '${REMOTE_ANDROIDS:-[{"name":"avd-play15","image":"google-play-avd","androidVersion":"15","gapps":true,"adbPort":5559}]}'
